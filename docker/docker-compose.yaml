services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-mattin_ai}
      POSTGRES_USER: ${DATABASE_USER:-mattin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mattin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # profiles: ["lightrag"]  # removed for local development; restore to enable profile-based startup
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__LOG_LEVEL: INFO
      # Enables Qdrant's own API key check so the QDRANT_API_KEY the backend
      # sends (see backend service env below) is actually enforced server-side.
      # Empty by default (no auth) to avoid breaking existing deployments that
      # don't set QDRANT_API_KEY in .env.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    networks:
      - mattin-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend:
    image: ghcr.io/lksnext-ai-lab/mattinai-backend:${IMAGE_TAG:-develop}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      SQLALCHEMY_DATABASE_URI: postgresql://${DATABASE_USER:-mattin}:${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}@postgres:5432/${DATABASE_NAME:-mattin_ai}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER:-mattin}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
      DATABASE_NAME: ${DATABASE_NAME:-mattin_ai}

      AICT_LOGIN: ${AICT_LOGIN:-LOCAL}
      # Set AUTH_COOKIE_SECURE=false for local HTTP testing (no TLS); keep true
      # in any HTTPS/production deployment so session cookies require a secure channel.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set in .env}"
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}

      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}

      FRONTEND_URL: ${AICT_PUBLIC_URL:-http://localhost}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}

      AICT_MODE: ${AICT_MODE:-SELF-HOSTED}
      AICT_OMNIADMINS: ${AICT_OMNIADMINS:-admin@example.com}
      REPO_BASE_FOLDER: ${REPO_BASE_FOLDER:-./data/repositories}

      VECTOR_DB_TYPE: ${VECTOR_DB_TYPE:-PGVECTOR}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_PREFER_GRPC: ${QDRANT_PREFER_GRPC:-false}

      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-}

      # Uvicorn worker pool. Documented in .env.example but never forwarded,
      # so the Dockerfile CMD's own default (2) silently won.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      LIGHTRAG_ENABLED: ${LIGHTRAG_ENABLED:-true}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j}
      # LightRAG indexing concurrency. Read by lightrag as dataclass field
      # defaults at import time, so they must be set here (container env), not
      # in Python. Defaults below match lightrag 1.5.5rc1's own defaults, so
      # leaving them unset changes nothing.
      MAX_PARALLEL_INSERT: ${MAX_PARALLEL_INSERT:-3}      # documents (= PDF pages) at once
      MAX_ASYNC_LLM: ${MAX_ASYNC_LLM:-4}                  # concurrent LLM calls per role
      EMBEDDING_FUNC_MAX_ASYNC: ${EMBEDDING_FUNC_MAX_ASYNC:-8}
      # Files the feeder keeps in flight. Not a throughput knob (3 average files
      # already exceed MAX_PARALLEL_INSERT in pages): it sets how many files
      # "Cancel" finishes before stopping, since cancel means "add nothing new,
      # finish what started".
      INGESTION_FEED_WINDOW: ${INGESTION_FEED_WINDOW:-3}
      # Per-LLM-call ceiling. Also how long a hung socket (laptop suspend,
      # LLM host gone) takes to surface as a failure and abort the batch.
      LLM_TIMEOUT: ${LLM_TIMEOUT:-240}
      # Output cap for the entity-extraction LLM. Unset = provider default,
      # which on vLLM means the rest of the context window (~30k tokens).
      LIGHTRAG_EXTRACT_MAX_TOKENS: ${LIGHTRAG_EXTRACT_MAX_TOKENS:-}
      # Send the extraction JSON schema as response_format so the server
      # constrains decoding. false = prompt-only JSON (LightRAG's own mode).
      LIGHTRAG_EXTRACT_GUIDED_JSON: ${LIGHTRAG_EXTRACT_GUIDED_JSON:-true}
      # LightRAG query budget. Same import-time dataclass-default mechanism as
      # the concurrency vars above. Defaults match lightrag 1.5.6's own.
      CHUNK_TOP_K: ${CHUNK_TOP_K:-20}                     # text chunks reaching the context
      MAX_TOTAL_TOKENS: ${MAX_TOTAL_TOKENS:-30000}        # whole-context ceiling
      # Graph entities/relations per retrieval; per-agent rag_k overrides it.
      AGENT_DEFAULT_RAG_K: ${AGENT_DEFAULT_RAG_K:-30}
      # Chunks pulled per entity/relation before the global CHUNK_TOP_K cut.
      RELATED_CHUNK_NUMBER: ${RELATED_CHUNK_NUMBER:-5}
      # Optional rerank endpoint (see .env.example). Read only by backend/config.py,
      # not by the embedded LightRAG library itself — unset here means silently off
      # even with a value in .env, same as every other var on this list.
      LIGHTRAG_RERANK_URL: ${LIGHTRAG_RERANK_URL:-}
      LIGHTRAG_RERANK_MODEL: ${LIGHTRAG_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      LIGHTRAG_RERANK_API_KEY: ${LIGHTRAG_RERANK_API_KEY:-}
      # Sandbox provider (IT-2). Default must be a provider actually registered
      # in backend/tools/sandbox/factory.py (opensandbox/daytona/e2b) — 'subprocess'
      # was removed and is no longer a valid provider name.
      SANDBOX_DEFAULT_PROVIDER: ${SANDBOX_DEFAULT_PROVIDER:-opensandbox}
      SANDBOX_ALLOWED_PROVIDERS: ${SANDBOX_ALLOWED_PROVIDERS:-opensandbox,daytona,e2b}
      # See docker/.env.example for the SSRF trade-off this controls — the
      # "Test Connection" probe and the save-time endpoint check both refuse
      # loopback/link-local/private targets by default, which also blocks
      # OPENSANDBOX_DOMAIN below when it's an internal Docker service name.
      SANDBOX_TEST_CONNECTION_ALLOW_PRIVATE: ${SANDBOX_TEST_CONNECTION_ALLOW_PRIVATE:-false}
      OPENSANDBOX_DOMAIN: ${OPENSANDBOX_DOMAIN:-opensandbox:8080}
      OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:-}
      OPENSANDBOX_CODE_INTERPRETER_IMAGE: ${OPENSANDBOX_CODE_INTERPRETER_IMAGE:-mattin-code-interpreter:latest}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      DAYTONA_API_URL: ${DAYTONA_API_URL:-}
      DAYTONA_TARGET: ${DAYTONA_TARGET:-}
      DAYTONA_IMAGE: ${DAYTONA_IMAGE:-}
      DAYTONA_SNAPSHOT: ${DAYTONA_SNAPSHOT:-}
      DAYTONA_WORKSPACE: ${DAYTONA_WORKSPACE:-workspace}
      DAYTONA_SUPPORTED_LANGUAGES: ${DAYTONA_SUPPORTED_LANGUAGES:-python,bash}
      DAYTONA_AUTO_STOP_INTERVAL: ${DAYTONA_AUTO_STOP_INTERVAL:-2}
      E2B_API_KEY: ${E2B_API_KEY:-}
      E2B_TEMPLATE: ${E2B_TEMPLATE:-}
      E2B_WORKSPACE: ${E2B_WORKSPACE:-/home/user/workspace}
      E2B_SUPPORTED_LANGUAGES: ${E2B_SUPPORTED_LANGUAGES:-python,javascript,bash}
      E2B_ALLOW_INTERNET_ACCESS: ${E2B_ALLOW_INTERNET_ACCESS:-true}
      SANDBOX_CREATE_TIMEOUT_S: ${SANDBOX_CREATE_TIMEOUT_S:-60}
      SANDBOX_DEFAULT_TIMEOUT_S: ${SANDBOX_DEFAULT_TIMEOUT_S:-30}
      SANDBOX_SESSION_TTL_H: ${SANDBOX_SESSION_TTL_H:-2}
      SANDBOX_IDLE_TIMEOUT_S: ${SANDBOX_IDLE_TIMEOUT_S:-120}
      SANDBOX_REAPER_INTERVAL_S: ${SANDBOX_REAPER_INTERVAL_S:-30}
      SANDBOX_MAX_EXECUTIONS_PER_TURN: ${SANDBOX_MAX_EXECUTIONS_PER_TURN:-5}
      OPENSANDBOX_MAX_CONTEXTS_PER_LANGUAGE: ${OPENSANDBOX_MAX_CONTEXTS_PER_LANGUAGE:-4}
      OPENSANDBOX_SUPPORTED_LANGUAGES: ${OPENSANDBOX_SUPPORTED_LANGUAGES:-python,bash}
    volumes:
      # Por defecto bind mount al repo — comportamiento histórico, intacto para
      # los despliegues de cliente ya existentes.
      # En multi-entorno local se apunta al volumen nombrado (BACKEND_DATA=backend-data),
      # que Compose prefija con el project name: cada entorno tiene sus propios
      # ficheros de repositorios en vez de compartir un único directorio del host.
      - ${BACKEND_DATA:-../backend/data}:/aict_backend/data
      - ${BACKEND_LOGS:-../backend/logs}:/aict_backend/logs
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_started
    networks:
      - mattin-network
    restart: unless-stopped

  frontend:
    image: ghcr.io/lksnext-ai-lab/mattinai-frontend:${IMAGE_TAG:-develop}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    environment:
      # SPA and API are same-origin behind Caddy, so the API base IS the public
      # URL. Both this and the backend's FRONTEND_URL derive ONLY from the
      # AICT_-namespaced AICT_PUBLIC_URL, never from ambient FRONTEND_URL /
      # VITE_API_BASE_URL — so a stray shell export from another project
      # (e.g. :3000 or :8000) can never hijack Mattin's URL.
      VITE_API_BASE_URL: ${AICT_PUBLIC_URL:-http://localhost}
      VITE_OIDC_ENABLED: ${VITE_OIDC_ENABLED:-false}
      VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
      VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-}
      VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email}
      VITE_OIDC_AUDIENCE: ${VITE_OIDC_AUDIENCE:-}
    depends_on:
      - backend
    networks:
      - mattin-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # OpenSandbox — isolated code execution server (IT-2)
  # Runs on the internal Docker network only; no port is exposed to the host.
  # Enable by setting SANDBOX_DEFAULT_PROVIDER=opensandbox in .env.
  #
  # Network topology (security-relevant — see sandbox.toml [docker] comment):
  # This service is dual-homed on purpose:
  #   - mattin-network: lets `backend` reach opensandbox:8080 to create/manage
  #     sandboxes.
  #   - sandbox-workloads: the network spawned sandbox containers run on
  #     (sandbox.toml [docker].network_mode). The opensandbox server needs to
  #     be reachable from that network too because it proxies exec/file
  #     operations into the sandbox containers (use_server_proxy=true in
  #     backend/tools/sandbox/opensandbox_provider.py).
  # Spawned sandbox containers themselves are NOT attached to mattin-network,
  # so LLM-run code inside a sandbox has no route to backend, postgres,
  # qdrant, caddy, or frontend — only to the opensandbox server on
  # sandbox-workloads, plus whatever the Docker socket mount lets the
  # *server* do (not the sandbox itself).
  # ---------------------------------------------------------------------------
  opensandbox:
    image: mattin-opensandbox-server:${OPENSANDBOX_SERVER_VERSION:-0.1.11}
    build:
      context: ./opensandbox
      dockerfile: Dockerfile
      args:
        OPENSANDBOX_SERVER_VERSION: ${OPENSANDBOX_SERVER_VERSION:-0.1.11}
    command: ["--config", "/etc/opensandbox/sandbox.toml"]
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/sandbox.toml
      DOCKER_HOST: unix:///var/run/docker.sock
      # The OpenSandbox server has no API key in the checked-in local config.
      # It is only reachable on the internal Compose network.
      OPENSANDBOX_INSECURE_SERVER: ${OPENSANDBOX_INSECURE_SERVER:-YES}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./opensandbox/sandbox.toml:/etc/opensandbox/sandbox.toml:ro
      - opensandbox-data:/var/lib/opensandbox
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mattin-network
      - sandbox-workloads
    restart: unless-stopped
    profiles:
      - opensandbox

  # ---------------------------------------------------------------------------
  # mattin-code-interpreter — custom sandbox container image builder.
  # Extends opensandbox/code-interpreter:v1.0.2 with a tail wrapper that
  # starts Jupyter before execd connects, fixing the opensandbox entrypoint
  # override bug.  This service exits immediately after the image is built;
  # the built image is used by the opensandbox server when spawning sandboxes.
  # ---------------------------------------------------------------------------
  mattin-code-interpreter:
    image: mattin-code-interpreter:latest
    build:
      context: ./opensandbox/code-interpreter
      dockerfile: Dockerfile
    entrypoint: ["/bin/true"]
    restart: no
    profiles:
      - opensandbox

  db_test:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${TEST_DB_NAME:-test_db}
      POSTGRES_USER: ${TEST_DB_USER:-test_user}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-test_pass}  # pragma: allowlist secret
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - mattin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - test

  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - mattin-network
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: mattin-neo4j
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neo4j}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - mattin-network
    # Internal-only: no published ports
    restart: unless-stopped

networks:
  mattin-network:
    driver: bridge
  # Isolated network for spawned OpenSandbox sandbox containers (the ones that
  # actually run LLM-generated code). It carries no route to backend,
  # postgres, qdrant, caddy, or frontend — only opensandbox itself is
  # dual-homed onto it (see opensandbox service comment above), so the
  # server-proxy exec/file path keeps working while code running inside a
  # sandbox can't reach app or data services on mattin-network.
  # Referenced from docker/opensandbox/sandbox.toml as
  # "docker_sandbox-workloads" ("docker" is this Compose project's default
  # name, i.e. this directory's basename; see that file's [docker] comment).
  sandbox-workloads:
    # docker/opensandbox/sandbox.toml hardcodea este nombre en network_mode.
    # Fijarlo aquí lo desacopla del project name (que ahora varía por entorno).
    # Para levantar el perfil opensandbox en más de un stack a la vez, dale a
    # cada uno su SANDBOX_NETWORK_NAME y su copia de sandbox.toml.
    name: ${SANDBOX_NETWORK_NAME:-docker_sandbox-workloads}
    driver: bridge

volumes:
  postgres-data:
  backend-data:
  backend-logs:
  qdrant-data:
  opensandbox-data:
  caddy-data:
  caddy-config:
  neo4j-data:
  neo4j-logs:
